[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-in-action-backend"
version = "0.1.0"
description = "Initial backend skeleton for a policy RAG knowledge library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
database = [
  "asyncpg>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
]
crawlers = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "playwright>=1.49,<2",
]
ai = [
  "numpy>=2,<3",
]
all = [
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "numpy>=2,<3",
  "playwright>=1.49,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
