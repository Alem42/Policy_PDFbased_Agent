[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-policy-research-backend"
version = "0.1.0"
description = "Configurable policy website ingestion backend for agents and RAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "fastembed>=0.8,<1",
  "httpx>=0.27,<1",
  "langchain-core>=1.4,<2",
  "langchain-openai>=1.3,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.27,<2",
  "lingua-language-detector>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "pillow>=11,<13",
  "psycopg[binary]>=3.3,<4",
  "pymupdf>=1.24,<2",
  "pypdf>=6.13,<7",
  "pytesseract>=0.3,<1",
  "python-docx>=1.1,<2",
  "tiktoken>=0.7,<1",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
database = [
  "asyncpg>=0.30,<1",
]
web-search = [
  "firecrawl-py>=2,<5",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx2>=2,<3",
  "ruff>=0.8,<1",
]
all = [
  "asyncpg>=0.30,<1",
  "firecrawl-py>=2,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

